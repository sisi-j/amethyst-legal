<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ '/assets/logos/network.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#7a3fd1">
  <link rel="icon" href="{{ '/assets/logos/network.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img src="{{ '/assets/logos/network.svg' | relative_url }}" alt="" width="28" height="28" class="brand-logo">
        Amethyst
      </a>
      <nav aria-label="Site">
        <a href="{{ '/' | relative_url }}#apps">Apps</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      </nav>
    </div>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="bottom">
    <div class="wrap bottom-inner">
      <p>Amethyst is a community project, not affiliated with DonutSMP, Mojang Studios, Microsoft or Discord.</p>
      <p class="bottom-links">
        <a href="{{ '/terms/' | relative_url }}">Terms of Service</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
        <a href="https://github.com/sisi-j/amethyst-legal/issues/new">Report a problem</a>
      </p>
    </div>
  </footer>
</body>
</html>
